version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  mcp-server:
      build:
        context: ./mcp-vector-db
        dockerfile: Dockerfile
      ports:
        - "8001:8001"
      depends_on:
        - chromadb
      environment:
        - CHROMA_HOST=chromadb
        - CHROMA_PORT=8000
        - OLLAMA_BASE_URL=http://host.docker.internal:11434
        - OLLAMA_MODEL=qwen2.5:0.5b
      volumes:
        - ./data:/app/data
      stdin_open: true   # Indispensable pour maintenir le conteneur éveillé
      tty: true          # Indispensable pour le flux interactif

  chatbot:
    build:
      context: ./chatbot-langchain
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - mcp-server
    environment:
      - MCP_SERVER_URL=http://mcp-server:8001/sse
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2:3b
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - chatbot

volumes:
  chroma_data: